# fly.toml app configuration file generated for riai on 2026-08-28T06:39:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riai'
primary_region = 'sjc'

[build]

[[mounts]]
  source = 'riai_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
